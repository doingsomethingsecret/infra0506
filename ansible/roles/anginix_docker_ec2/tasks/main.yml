- name: Installing the Apache web server
  apt:
    name: apache2
    state: present
    update_cache: yes
  become: yes

- name: Changing the default port of Apache web server
  lineinfile:
    path: /etc/apache2/ports.conf
    regexp: '^Listen 80'
    line: 'Listen 81'

- name: Updating the default apache host configuration to listen on port 81
  lineinfile:
    path: /etc/apache2/sites-available/000-default.conf
    regexp: '^<VirtualHost \*:80>'
    line: '<VirtualHost *:81>'

- name: Allow the new port 81 through the firewall
  ufw:
    rule: allow
    port: 81
    proto: tcp
  become: yes

